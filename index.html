<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1419">
    <meta name="application-name" content="성역 관리">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="성역 관리">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon-180.png">
    <title>성역 관리</title>
    <style>
        /* ========================================================
           [수정] CSS 변수를 체계적으로 분리하여 유지보수성 향상
           - 색상, 간격, 테두리 등 디자인 토큰을 한곳에서 관리
           ======================================================== */
        :root {
            /* ── 기본 색상 테마 ── */
            --bg-dark: #0f1419;
            --panel-dark: rgba(30, 39, 46, 0.5);
            --accent-gold: #e0cdab;

            /* ── 액션 버튼 색상 ── */
            --btn-blue: #2980b9;
            --btn-red: #c0392b;
            --btn-gray: rgba(52, 73, 94, 0.8);
            --btn-green: #27ae60; 

            /* ── 상태 메시지 색상 ── */
            --color-success: #4da6ff;   
            --color-error:   #ff4d4d;   
            --color-warning: #ff9f43;   

            /* ── 레이아웃 토큰 ── */
            --app-width: 400px;
            --app-height: 620px;
            --border-radius: 4px;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        @media (max-width: 450px) {
            :root { --app-width: 95vw; }
        }

        #app-container {
            width: var(--app-width);
            height: var(--app-height);
            background-color: var(--bg-dark);
            border: 2px solid var(--accent-gold);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            box-sizing: border-box; 
        }

        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 8px;
            border: none;
            background: none;
            color: #7f8c8d;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .tab-btn.active {
            color: var(--accent-gold);
            background: var(--panel-dark);
            border-bottom: 2px solid var(--accent-gold);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.5s ease;
        }

        .bg-ludra,
        .bg-chimsik,
        .bg-muspell {
            background-image: linear-gradient(rgba(15, 20, 25, 0.8), rgba(15, 20, 25, 0.9));
        }

        .bg-ludra    { background-image: url('bg_ludra.png'),      linear-gradient(rgba(15,20,25,0.8), rgba(15,20,25,0.9)); }
        .bg-chimsik  { background-image: url('bg_main.png'),       linear-gradient(rgba(15,20,25,0.8), rgba(15,20,25,0.9)); }
        .bg-muspell  { background-image: url('bg_muspell.png'),    linear-gradient(rgba(15,20,25,0.8), rgba(15,20,25,0.9)); }

        h2 {
            color: var(--accent-gold);
            margin: 0 0 15px 0;
            font-size: 24px;
            text-shadow: 2px 2px 8px black;
        }

        input, select {
            width: 250px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-gold);
            color: white;
            text-align: center;
            font-size: 15px;
            margin-bottom: 8px;
            border-radius: var(--border-radius);
            outline: none;
        }

        input:focus, select:focus {
            border-color: #fff;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        select option { background: #222; color: white; }

        .status-badge {
            color: var(--color-warning);
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px black;
        }

        .action-btn {
            width: 275px;
            padding: 10px;
            margin: 4px 0;
            border: none;
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: filter 0.2s, transform 0.1s; 
        }

        .action-btn:hover  { filter: brightness(1.2); }
        .action-btn:active { transform: scale(0.97); } 

        .btn-cal  { background: var(--btn-gray); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .btn-search { background: var(--btn-blue); opacity: 0.9; }
        .btn-submit { background: var(--btn-red); opacity: 0.9; }
        .btn-participants { background: var(--btn-green); opacity: 0.9; } 

        #result-display {
            width: 320px;
            height: 100px;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(224, 205, 171, 0.3);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            padding: 8px;
            color: white;
            white-space: pre-wrap;
        }

        #cal-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid var(--accent-gold);
            z-index: 100;
            padding: 15px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
            margin-top: 10px;
            color: white;
        }

        .cal-day { padding: 8px 0; cursor: pointer; border-radius: 3px; font-size: 12px; }
        .cal-day:hover { background: var(--accent-gold); color: black; }

        /* ========================================================
           참여자 목록 모달 레이아웃 스타일
           ======================================================== */
        #participants-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 480px;
            background: rgba(10, 15, 20, 0.98);
            border: 2px solid var(--accent-gold);
            z-index: 200;
            padding: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            box-sizing: border-box;
            border-radius: 6px;
        }

        .p-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(224, 205, 171, 0.3);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .p-modal-title {
            color: var(--accent-gold);
            font-size: 16px;
            font-weight: bold;
        }

        .p-modal-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .p-modal-close:hover { color: white; }

        .p-modal-body {
            width: 100%;
            height: calc(100% - 40px);
            overflow-y: auto;
            color: white;
            font-family: 'Malgun Gothic', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            text-align: left;
            padding-right: 5px;
        }
        .p-modal-body::-webkit-scrollbar { width: 6px; }
        .p-modal-body::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 3px; }
        .p-modal-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }

        /* ========================================================
           아티팩트 / 일정 패널 (고정 앱 규격 내부 스크롤)
           ======================================================== */
        .tab-btn { padding: 15px 2px; font-size: 12px; white-space: nowrap; }

        .info-panel {
            display: none;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
            color: #fff;
            font-size: 13px;
            background: linear-gradient(rgba(15,20,25,0.9), rgba(15,20,25,0.95));
        }
        .info-panel::-webkit-scrollbar { width: 6px; }
        .info-panel::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 3px; }
        #artifact-area {
            background-image: linear-gradient(rgba(15,20,25,0.30), rgba(15,20,25,0.50)), url('bg_abyss.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        #schedule-area {
            background-image: linear-gradient(rgba(15,20,25,0.30), rgba(15,20,25,0.50)), url('bg_today.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .info-panel h2 { font-size: 18px; margin-bottom: 8px; text-align: center; }
        .info-sub { color: #9aa5ad; font-size: 11px; text-align: center; margin-bottom: 8px; }
        .info-msg { text-align: center; padding: 30px 0; color: #9aa5ad; }
        .info-msg.err { color: var(--color-error); }

        .mini-btn {
            background: var(--btn-gray); color: var(--accent-gold);
            border: 1px solid rgba(224,205,171,0.5); border-radius: var(--border-radius);
            padding: 4px 10px; font-size: 12px; cursor: pointer;
        }
        .mini-btn:hover { filter: brightness(1.3); }

        .af-versus { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
        .af-side { flex: 1; text-align: center; padding: 8px 4px; border-radius: 4px; background: rgba(0,0,0,0.45); border: 1px solid rgba(224,205,171,0.25); }
        .af-side.me { border-color: var(--color-success); }
        .af-side b { display: block; font-size: 15px; }
        .af-side span { font-size: 22px; font-weight: bold; color: var(--accent-gold); }
        .af-vs { color: #7f8c8d; font-weight: bold; }
        .af-layer { margin-bottom: 8px; background: rgba(0,0,0,0.4); border: 1px solid rgba(224,205,171,0.2); border-radius: 4px; padding: 6px 8px; }
        .af-layer-title { color: var(--accent-gold); font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .af-layer-title small { color: #9aa5ad; font-weight: normal; }
        .af-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.06); }
        .af-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; white-space: nowrap; }
        .af-badge.mine { background: rgba(41,128,185,0.35); color: var(--color-success); border: 1px solid var(--color-success); }
        .af-badge.enemy { background: rgba(192,57,43,0.3); color: var(--color-error); border: 1px solid var(--color-error); }
        .af-badge.none { background: rgba(127,140,141,0.25); color: #aaa; border: 1px solid #7f8c8d; }
        .af-next { text-align: center; padding: 6px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-gold); border-radius: 4px; margin-bottom: 8px; }

        .sc-hero { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .sc-dow { width: 42px; height: 42px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #7be0a0; background: rgba(39,174,96,0.25); border: 1px solid #2f7a4f; border-radius: 8px; }
        .sc-hero-text { flex: 1; min-width: 0; }
        .sc-hero-text b { display: block; font-size: 16px; color: #fff; }
        .sc-hero-text small { color: #9aa5ad; font-size: 11px; }
        .sc-nav { display: flex; gap: 4px; }
        .sc-countdown { text-align: center; padding: 8px; margin-bottom: 8px; border: 1px dashed rgba(224,205,171,0.45); border-radius: 8px; background: rgba(0,0,0,0.35); }
        .sc-clock { font-size: 11px; color: #9aa5ad; font-variant-numeric: tabular-nums; }
        .sc-next-label { color: var(--accent-gold); font-size: 12px; margin-top: 2px; }
        .sc-remain { font-size: 26px; font-weight: bold; color: #fff; font-variant-numeric: tabular-nums; min-height: 32px; }
        .sc-remain small { font-size: 12px; color: var(--accent-gold); margin: 0 2px; }
        .sc-filters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .sc-chip { padding: 2px 8px; border-radius: 10px; font-size: 11px; cursor: pointer; background: rgba(0,0,0,0.5); color: #aaa; border: 1px solid #555; }
        .sc-chip.active { color: #000; background: var(--accent-gold); border-color: var(--accent-gold); }
        .sc-row { display: flex; align-items: center; gap: 6px; padding: 9px 10px; margin-bottom: 6px; background: rgba(0,0,0,0.45); border: 1px dashed rgba(224,205,171,0.25); border-radius: 8px; }
        .sc-row.next { background: rgba(224,205,171,0.14); border-color: var(--accent-gold); }
        .sc-row.live { border-color: var(--color-success); }
        .sc-names { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-weight: bold; font-size: 14px; }
        .sc-ev { white-space: nowrap; }
        .sc-end { color: #9aa5ad; font-weight: normal; margin-left: 4px; font-size: 10px; }
        .sc-plus { color: #7f8c8d; }
        .sc-badge { font-size: 10px; background: var(--accent-gold); color: #000; border-radius: 9px; padding: 1px 7px; font-weight: bold; }
        .sc-time { font-weight: bold; font-size: 16px; color: var(--accent-gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .sc-row.live .sc-time { color: var(--color-success); font-size: 13px; }
        .sc-notice-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; padding: 6px 8px; background: rgba(0,0,0,0.42); border: 1px solid rgba(224,205,171,0.3); border-radius: 6px; }
        .sc-notice-text { color: #b7c0c6; font-size: 11px; }
        .sc-notice-text.enabled { color: var(--color-success); }
        .sc-notify { width: 28px; height: 28px; padding: 0; flex: none; border: 1px solid #66737b; border-radius: 50%; background: rgba(0,0,0,0.35); color: #aab4ba; cursor: pointer; font-size: 14px; }
        .sc-notify.selected { background: rgba(224,205,171,0.2); color: var(--accent-gold); border-color: var(--accent-gold); }
        .sc-notify:hover { filter: brightness(1.3); }
        #pwa-install-button {
            display: none; position: fixed; right: 16px; bottom: 16px; z-index: 500;
            padding: 10px 14px; border: 1px solid var(--accent-gold); border-radius: 20px;
            background: #18242d; color: var(--accent-gold); font-weight: bold; cursor: pointer;
            box-shadow: 0 3px 12px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
<div id="app-container">
    <div class="tabs" role="tablist">
        <button id="btn-ludra"   class="tab-btn active" onclick="switchTab('ludra', 2700)" aria-selected="true">비탄의설원</button>
        <button id="btn-chimsik" class="tab-btn"         onclick="switchTab('chimsik', 3500)" aria-selected="false">침식된</button>
        <button id="btn-muspell" class="tab-btn"         onclick="switchTab('muspell', 4300)" aria-selected="false">무스펠</button>
                <button id="btn-artifact" class="tab-btn"        onclick="switchTab('artifact')" aria-selected="false">아티팩트</button>
                <button id="btn-schedule" class="tab-btn"        onclick="switchTab('schedule')" aria-selected="false">일일일정</button>
            </div>

    <div id="main-area" class="main-content bg-ludra" role="region" aria-label="성역 정보 조회 영역">
        <h2 id="title">⚔ 비탄의설원</h2>
        <input type="text" id="char-name" placeholder="캐릭터명 입력 후 엔터">

        <div id="time-area">
            <select id="raid-time" aria-label="레이드 시간 선택">
                <option value="7시~8시">시간: 7시 ~ 8시</option>
                <option value="8시~9시">시간: 8시 ~ 9시</option>
                <option value="9시~10시">시간: 9시 ~ 10시</option>
                <option value="10시~11시">시간: 10시 ~ 11시</option>
                <option value="11시이상">시간: 11시 이상</option>
            </select>
        </div>

        <div id="diff-area" style="display: none;">
            <select id="difficulty" onchange="resetSelection()" aria-label="난이도 선택">
                <option value="쉬움">난이도: 쉬움 (Lv 5800↑)</option>
                <option value="보통">난이도: 보통 (Lv 6000↑)</option>
                <option value="어려움">난이도: 어려움 (Lv 6200↑)</option>
            </select>
        </div>

        <button class="action-btn btn-cal" onclick="toggleCal()" aria-label="날짜 선택 달력 열기">📅 날짜 선택</button>
        <div id="date-text" style="color: var(--accent-gold); margin: 3px 0; font-weight: bold; text-shadow: 1px 1px 2px black;">날짜: 설정 중...</div>

        <button class="action-btn btn-search" onclick="fetchData()" aria-label="캐릭터 정보 조회">정보 조회</button>
        <button class="action-btn btn-submit" onclick="submitData()" aria-label="신청 제출">참여 체크</button>
        
        <!-- 참여자 보기 버튼 -->
        <button class="action-btn btn-participants" onclick="toggleParticipantsModal()" aria-label="이번 주 참여자 명단 보기">👥 참여자 보기</button>

        <div id="result-display" role="status" aria-live="polite">캐릭터명을 조회해 주세요.</div>
    </div>

    <!-- 아티팩트 점령현황 패널 -->
    <div id="artifact-area" class="info-panel" role="region" aria-label="아티팩트 점령현황">
        <h2>🏛 아티팩트 점령현황</h2>
        <div id="artifact-body" class="info-msg">불러오는 중...</div>
    </div>

    <!-- 일일 스케줄 패널 -->
    <div id="schedule-area" class="info-panel" role="region" aria-label="일일 스케줄">
        <h2>📅 일일 스케줄</h2>
        <div id="schedule-body" class="info-msg">불러오는 중...</div>
    </div>

    <!-- 달력 모달 -->
    <div id="cal-modal" role="dialog" aria-label="날짜 선택">
        <div style="display:flex; justify-content: space-between; align-items: center; color: white;">
            <button onclick="moveMonth(-1)" aria-label="이전 달">&lt;</button>
            <b id="cal-title">2026.04</b>
            <button onclick="moveMonth(1)" aria-label="다음 달">&gt;</button>
        </div>
        <div class="cal-grid" id="cal-body"></div>
        <button onclick="toggleCal()" style="width:100%; margin-top:10px; background:#333; color:white; border:none; padding:8px; cursor:pointer;">닫기</button>
    </div>

    <!-- 참여자 조회 출력 모달 -->
    <div id="participants-modal" role="dialog" aria-label="이번 주 명단">
        <div class="p-modal-header">
            <!-- [변경] 현재 열린 성역 이름이 타이틀에 표시되도록 연동 -->
            <span id="p-modal-title" class="p-modal-title">📋 명단 조회</span>
            <button class="p-modal-close" onclick="toggleParticipantsModal()">&times;</button>
        </div>
        <div id="participants-body" class="p-modal-body">조회 중...</div>
    </div>
</div>
<button id="pwa-install-button" type="button" aria-label="성역 관리 앱 설치">📲 앱 설치</button>

<script>
const CONFIG = {
    api: "https://script.google.com/macros/s/AKfycbyc-ubmUsuP7pfBsvVMd55iT5m1v0KWTWxtoNC8cdcqEoLZAF6AHkUbaCJFLh5VN09Yjw/exec",
    forms: {
        ludra:   "https://docs.google.com/forms/d/e/1FAIpQLScrzEVn9LGM0ZYYe0c4zb872cr0jiPv_nzRPbvEe6fPRouo8g/formResponse",
        chimsik: "https://docs.google.com/forms/d/e/1FAIpQLSdMCK4YAeyg8el3ALNaALCCW3-li_fpWPebu8ICpDDQkgD8zg/formResponse",
        muspell: "https://docs.google.com/forms/d/e/1FAIpQLSeVxOs4bvl6XB9ijHETtGTfi2tjWntBT1Db1Nzyji1hg1jwBA/formResponse",
    },
    raidLv: {
        chimsik: 3500,
    },
    difficultyRequirements: {
        ludra: {
            "쉬움": 5800,
            "보통": 6000,
            "어려움": 6200,
        },
        muspell: {
            "보통": 4300,
            "어려움": 4500,
        },
    },
    tabNames: { ludra: "비탄의설원", chimsik: "침식", muspell: "무스펠" }, /* [수정] 백엔드 키값 규격 매핑 일치 */

async function fetchData() {
    const inputName = $("char-name").value.trim();
    if (!inputName) return alert("이름을 입력하세요.");

    const resDiv = $("result-display");
    resDiv.innerText = "데이터를 불러오는 중...";
    resDiv.style.color = "white"; 

    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); 

        const response = await fetch(CONFIG.api, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const user = data.find(row => String(row[0]).trim() === inputName);

        if (!user) {
            state.selectedChar = null;
            resDiv.innerText  = "정보가 없습니다.";
            resDiv.style.color = "#ff5c5c";
            return;
        }

        const powerVal = String(user[4] || "0");
        const displayPower = powerVal.toUpperCase().includes("K") ? powerVal : powerVal + "K";
        const charLv = parseInt(String(user[5] || "0").replace(/[^0-9]/g, ""));

        const requiredLv = getRequiredLv(state.currentTab);

        if (charLv >= requiredLv) {
            state.selectedChar = {
                name:     user[0],
                class:    user[1],
                power:    displayPower,
                lv:       charLv,
            };

            resDiv.style.color = "#4da6ff";

            const successTitleFn = CONFIG.successTitles[state.currentTab];
            const titleText = typeof successTitleFn === "function" ? successTitleFn() : successTitleFn;

            resDiv.innerText =
                `${titleText}\n\n캐릭터: ${user[0]}\n레벨: ${user[5]}\n전투력: ${displayPower}`;
        } else {
            state.selectedChar = null;
            resDiv.style.color = "#ff4d4d";
            resDiv.innerText   = `❌ 입장 레벨 부족 ❌\n최소 ${requiredLv}레벨 필요\n(현재 레벨: ${user[5]})`;
        }

    } catch (e) {
        if (e.name === "AbortError") {
            $("result-display").innerText = "⏱ 응답 시간이 초과되었습니다.";
        } else {
            $("result-display").innerText = "데이터 로드 실패";
        }
        $("result-display").style.color = "#ff5c5c";
    }
}

async function submitData() {
    if (!state.selectedChar) return alert("신청 가능한 캐릭터가 아닙니다.");

    const tab = state.currentTab;
    const formUrl = CONFIG.forms[tab];
    const entries = CONFIG.formEntries[tab];
    const formData = new FormData();

    formData.append(entries.name,      state.selectedChar.name);
    formData.append(entries.class,     state.selectedChar.class || "미정");
    formData.append(entries.power,     state.selectedChar.power);
    formData.append(entries.tab,       CONFIG.formTabValues[tab] || CONFIG.tabNames[tab]);

    formData.append(entries.dateY,      String(state.targetDate.getFullYear()));
    formData.append(entries.dateM,      String(state.targetDate.getMonth() + 1).padStart(2, '0'));
    formData.append(entries.dateD,      String(state.targetDate.getDate()).padStart(2, '0'));

    const selectedTime = $("raid-time").value;
    formData.append(entries.time, selectedTime);

    if (entries.difficulty !== null) {
        formData.append(entries.difficulty, $("difficulty").value);
    }

    try {
        await fetch(formUrl, { method: "POST", mode: "no-cors", body: formData });

        const msgFn = CONFIG.alertMessages[tab];
        let alertMsg;

        if (tab === "muspell" || tab === "ludra") {
            alertMsg = msgFn(state.selectedChar.name, CONFIG.tabNames[tab], $("difficulty").value, selectedTime);
        } else if (tab === "chimsik") {

            alertMsg = msgFn(state.selectedChar.name, CONFIG.tabNames[tab], selectedTime);
        }

        alert(alertMsg);
    } catch (e) {
        alert("전송 오류");
    }
}

function toggleCal() {
    const isShowing = calModal.style.display === "block";
    calModal.style.display = isShowing ? "none" : "block";

    if (!isShowing) renderCal();
    else calBody.innerHTML = "";
}

function renderCal() {
    const y = state.viewDate.getFullYear();
    const m = state.viewDate.getMonth();
    calTitleEl.innerText = `${y}.${String(m + 1).padStart(2, '0')}`;
    calBody.innerHTML = "";

    ["일", "월", "화", "수", "목", "금", "토"].forEach(day => {
        const el = document.createElement("div");
        el.innerText = day;
        el.style.color = "#aaa";
        calBody.appendChild(el);
    });

    const firstDay  = new Date(y, m, 1).getDay();
    const lastDate  = new Date(y, m + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        calBody.appendChild(document.createElement("div"));
    }

    for (let d = 1; d <= lastDate; d++) {
        const dayEl = document.createElement("div");
        dayEl.innerText = d;
        dayEl.className = "cal-day";

        dayEl.addEventListener("click", () => {
            state.targetDate = new Date(y, m, d);
            $("date-text").innerText = `날짜: ${formatDate(state.targetDate)}`;
            toggleCal();
        });

        calBody.appendChild(dayEl);
    }
}

function moveMonth(n) {
    state.viewDate.setMonth(state.viewDate.getMonth() + n);

}

        list.forEach((item, index) => {
            // 백엔드 데이터 포맷 대응 유연화 처리
            // 1. 객체/배열 형태 형태의 데이터인 경우 {name: '홍길동', power: '4500K'}
            if (typeof item === 'object' && item !== null) {
                const name = item.name || "이름 없음";
                const power = item.power ? `(${item.power})` : "";
                textOutput += `${index + 1}. ${name} ${power}\n`;
            } 
            // 2. 이미 문자열로 합쳐져서 넘어오는 경우 (예: "홍길동 (4200K)")
            else if (typeof item === 'string') {

        textOutput += "신청된 내역이 없습니다.\n";

// sagye.kr 은 CORS 헤더가 없어 직접 요청이 막히면 프록시로 재시도
async function fetchJson(url, useProxyFallback) {
    const attempt = async (u) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        try {
            const res = await fetch(u, { signal: controller.signal, cache: "no-store" });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } finally {
            clearTimeout(timer);
        }
    };
    try {
        return await attempt(url);
    } catch (e) {
        if (!useProxyFallback) throw e;
        return attempt("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    }
}

async function cachedJson(key, url, useProxyFallback, ttlMs = 60000) {
    const hit = infoCache[key];
    if (hit && Date.now() - hit.at < ttlMs) return hit.data;
    const data = await fetchJson(url, useProxyFallback);
    infoCache[key] = { at: Date.now(), data };
    return data;
}

        if (!pair) throw new Error("카사카 서버 대진 정보를 찾을 수 없습니다.");

function renderArtifact(pair) {
    const mySide = pair.west.serverId === KASAKA.id ? 1 : 2;
    const enemy = mySide === 1 ? pair.east : pair.west;
    let mine = 0, theirs = 0;

    const layersHtml = [1, 2].map((n) => {
        const layer = (pair.layers || []).find((l) => l.layer === n);
        const owners = new Map((layer?.entries || []).map((e) => [e.artifactId, e.ownerSide]));
        const rows = ARTIFACT_NAMES[n].map(([id, name]) => {
            const owner = owners.get(id);
            let cls = "none", text = "미확정";
            if (owner === mySide) { cls = "mine"; text = `${KASAKA.name} 점령`; mine++; }
            else if (owner === 1 || owner === 2) { cls = "enemy"; text = `${enemy.name} 점령`; theirs++; }
            return `<div class="af-row"><span>${escHtml(name)}</span><span class="af-badge ${cls}">${text}</span></div>`;
        }).join("");
        const obs = layer?.observedAt ? `${kstTime(layer.observedAt * 1000)} 갱신` : "";
        return `<div class="af-layer"><div class="af-layer-title"><span>${n === 1 ? "하층" : "중층"}</span><small>${obs}</small></div>${rows}</div>`;
    }).join("");

    $("artifact-body").className = "";
    $("artifact-body").innerHTML = `
        <div class="af-versus">
            <div class="af-side me"><b>${KASAKA.name}</b><span>${mine}</span></div>
            <div class="af-vs">VS</div>
            <div class="af-side"><b>${escHtml(enemy.name)}</b><span>${theirs}</span></div>
        </div>
        <div class="af-next">다음 점령전<br><b style="color:var(--accent-gold)">${pair.nextBattleAt ? kstDateTime(pair.nextBattleAt) : "-"}</b></div>
        ${layersHtml}
        <div class="info-sub">출처: notmeter.com · 유저 제보 기반 · 수/토 점령전</div>
        <div style="text-align:center"><button class="mini-btn" onclick="delete infoCache.artifact; loadArtifact()">🔄 새로고침</button></div>`;
}

async function enableScheduleNotifications() {
    if (!("Notification" in window)) {
        alert("이 브라우저는 알림을 지원하지 않습니다.");
        return;
    }

    try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
            alert("알림이 허용되지 않았습니다. 브라우저 또는 휴대폰 설정에서 이 사이트의 알림을 허용해 주세요.");
        }
    } catch (error) {
        console.error("알림 권한 요청 실패:", error);
        alert("알림 권한 요청에 실패했습니다. 브라우저 또는 휴대폰 설정을 확인해 주세요.");
    }
    renderSchedule();
}

function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    return Uint8Array.from(atob(base64), (character) => character.charCodeAt(0));
}

function hasCurrentPushApplicationKey(subscription, publicKey) {
    const currentKey = subscription.options?.applicationServerKey;
    if (!currentKey) return false;
    const currentBytes = new Uint8Array(currentKey);
    const configuredBytes = urlBase64ToUint8Array(publicKey);
    return currentBytes.length === configuredBytes.length
        && currentBytes.every((byte, index) => byte === configuredBytes[index]);
}

async function removePushSubscription(subscription) {
    const response = await fetch(`${PUSH_API_URL}/subscribe`, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ endpoint: subscription.endpoint }),
    });
    if (!response.ok) throw new Error(`푸시 구독 삭제 실패 (HTTP ${response.status})`);
    if (!await subscription.unsubscribe()) throw new Error("기존 푸시 구독을 해제하지 못했습니다.");
}

async function loadPushConfig() {
    const response = await fetch(`${PUSH_API_URL}/config`);
    if (!response.ok) throw new Error(`푸시 설정 조회 실패 (HTTP ${response.status})`);
    const config = await response.json();
    if (!config.vapidPublicKey) throw new Error("푸시 공개 키가 설정되지 않았습니다.");
    return config;
}

async function syncSchedulePushSubscription(selections) {
    if (!PUSH_API_URL) throw new Error("푸시 서버 주소가 아직 설정되지 않았습니다.");
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        throw new Error("이 브라우저는 백그라운드 푸시 알림을 지원하지 않습니다.");
    }

    await navigator.serviceWorker.register("./service-worker.js");
    const registration = await navigator.serviceWorker.ready;
    let subscription = await registration.pushManager.getSubscription();
    if (!selections.size) {
        if (subscription) await removePushSubscription(subscription);
        return;
    }

    const config = await loadPushConfig();
    if (subscription && !hasCurrentPushApplicationKey(subscription, config.vapidPublicKey)) {
        await removePushSubscription(subscription);
        subscription = null;
    }
    if (!subscription) {
        subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(config.vapidPublicKey),
        });
    }
    const response = await fetch(`${PUSH_API_URL}/subscribe`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            subscription: subscription.toJSON(),
            definitionIds: [...selections],
        }),
    });
    if (!response.ok) throw new Error(`푸시 구독 저장 실패 (HTTP ${response.status})`);
}

async function syncSavedSchedulePushSubscription() {
    const selections = getNoticeSelections();
    if (!selections.size || notificationStatus() !== "granted") {
        schedulePushSyncStatus = "idle";
        renderSchedule();
        return;
    }

    schedulePushSyncStatus = "syncing";
    renderSchedule();
    try {
        await syncSchedulePushSubscription(selections);
        schedulePushSyncStatus = "synced";
    } catch (error) {
        console.error("저장된 푸시 구독 동기화 실패:", error);
        schedulePushSyncStatus = "error";
    }
    renderSchedule();
}

async function toggleScheduleNotice(definitionIds) {
    if (notificationStatus() !== "granted") {
        await enableScheduleNotifications();
        if (notificationStatus() !== "granted") return;
    }

    const selections = getNoticeSelections();
    const allSelected = definitionIds.every((id) => selections.has(id));
    definitionIds.forEach((id) => allSelected ? selections.delete(id) : selections.add(id));
    try {
        schedulePushSyncStatus = "syncing";
        await syncSchedulePushSubscription(selections);
        saveNoticeSelections(selections);
        schedulePushSyncStatus = "synced";
        renderSchedule();
    } catch (error) {
        console.error("일정 푸시 알림 설정 실패:", error);
        schedulePushSyncStatus = "error";
        alert(`알림 설정을 저장하지 못했습니다: ${error.message}`);
        renderSchedule();
    }
}

function renderSchedule() {
    syncScheduleToday();
    const { data, date, category } = scheduleState;
    const now = Date.now();
    const isToday = date === kstDateStr(now);
    const pick = (o) => !o.cancelled
        && (category === "all" || (category === "main" ? MAIN_CATEGORIES.includes(o.category) : o.category === category))
        && (!isToday || (o.endAt ? o.endAt > now : o.startAt > now));
    const items = data.occurrences.filter((o) => o.date === date && pick(o)).sort((a, b) => a.startAt - b.startAt);

    // 같은 시각의 일정은 '동시' 한 줄로 묶음
    const groups = [];
    for (const o of items) {
        const last = groups[groups.length - 1];
        if (last && last.startAt === o.startAt) last.items.push(o);
        else groups.push({ startAt: o.startAt, items: [o] });
    }
    const nextGroup = groups.find((g) => g.startAt > now);
    scheduleState.expireAt = isToday
        ? Math.min(...items.map((o) => (o.endAt && o.endAt > now ? o.endAt : o.startAt)).filter((t) => t > now), Infinity)
        : Infinity;
    scheduleState.nextAt = nextGroup && isToday ? nextGroup.startAt : null;
    scheduleState.nextName = nextGroup ? nextGroup.items.map((o) => SCHEDULE_DISPLAY[o.definitionId] || o.name).join(" + ") : "";

    const wd = WEEKDAYS[new Date(date + "T00:00:00Z").getUTCDay()];
    const chips = [["main", "주요"], ["all", "전체"], ...Object.entries(SCHEDULE_CATEGORIES).map(([k, v]) => [k, v.label])]
        .map(([k, label]) => `<span class="sc-chip ${k === category ? "active" : ""}" onclick="setScheduleCategory('${k}')">${label}</span>`)
        .join("");

    const selections = getNoticeSelections();
    const rows = groups.map((g) => {
        const multi = g.items.length > 1;
        const cat = SCHEDULE_CATEGORIES[g.items[0].category] || { color: "#7f8c8d" };
        const definitionIds = [...new Set(g.items.map((o) => o.definitionId))];
        const selected = definitionIds.every((id) => selections.has(id));
        const names = g.items.map((o) => {
            const icon = SCHEDULE_ICONS[o.definitionId] || "";
            const end = o.endAt ? `<small class="sc-end">~${kstTime(o.endAt)}</small>` : "";
            return `<span class="sc-ev">${icon} ${escHtml(SCHEDULE_DISPLAY[o.definitionId] || o.name)}${end}</span>`;
        }).join('<span class="sc-plus">+</span>');
        const isNext = g === nextGroup && isToday;
        const live = g.startAt <= now;
        return `<div class="sc-row ${isNext ? "next" : ""} ${live ? "live" : ""}" style="--c:${cat.color}">
            ${multi ? '<span class="sc-badge">동시</span>' : ""}<span class="sc-names">${names}</span>
            <button class="sc-notify ${selected ? "selected" : ""}" onclick='toggleScheduleNotice(${JSON.stringify(definitionIds)})' aria-label="${selected ? "일정 알림 해제" : "일정 알림 설정"}" title="${selected ? "알림 해제" : "5분 전·시작 알림 설정"}">${selected ? "🔔" : "🔕"}</button>
            <span class="sc-time">${live ? "진행중" : kstTime(g.startAt)}</span></div>`;
    }).join("") || `<div class="info-msg">남은 일정이 없습니다.</div>`;

    $("schedule-body").className = "";
    $("schedule-body").innerHTML = `
        <div class="sc-hero">
            <div class="sc-dow">${wd}</div>
            <div class="sc-hero-text"><b>${wd}요일 일정${isToday ? " · 오늘" : ""}</b>
                <small>${escHtml(data.serverName)} · ${date} · 남은 ${groups.length}건</small></div>
            <div class="sc-nav"><button class="mini-btn" onclick="shiftScheduleDate(-1)">◀</button><button class="mini-btn" onclick="shiftScheduleDate(1)">▶</button></div>
        </div>
        <div class="sc-countdown">
            <div id="sc-clock" class="sc-clock"></div>
            <div id="sc-next-label" class="sc-next-label"></div>
            <div id="sc-remain" class="sc-remain"></div>
        </div>
        <div class="sc-notice-bar">
            <span class="sc-notice-text ${schedulePushSyncStatus === "synced" && selections.size ? "enabled" : ""}">${!PUSH_API_URL ? "🔕 푸시 서버 설정이 필요합니다" : notificationStatus() !== "granted" ? "🔕 알림 권한이 필요합니다" : schedulePushSyncStatus === "syncing" ? "🔄 푸시 연결 확인 중..." : schedulePushSyncStatus === "error" ? "⚠️ 푸시 연결 실패" : schedulePushSyncStatus === "synced" && selections.size ? "🔔 선택 일정 푸시 연결됨" : "🔔 일정별 알림을 선택해 주세요"}</span>
            ${schedulePushSyncStatus === "error" ? '<button class="mini-btn" onclick="syncSavedSchedulePushSubscription()">재시도</button>' : ""}
            ${notificationStatus() === "granted" || !PUSH_API_URL ? "" : '<button class="mini-btn" onclick="enableScheduleNotifications()">알림 허용</button>'}
        </div>
        <div class="sc-filters">${chips}</div>
        ${rows}
        <div class="info-sub" style="margin-top:8px">출처: sagye.kr · KST · <span style="cursor:pointer;text-decoration:underline" onclick="delete infoCache.schedule; loadSchedule()">새로고침</span></div>`;
    tickClock();
    if (schedulePushSyncStatus === "idle" && notificationStatus() === "granted" && getNoticeSelections().size) {
        void syncSavedSchedulePushSubscription();
    }
}

function tickClock() {
    const clock = $("sc-clock");
    if (!clock) return;
    if (syncScheduleToday()) {
        renderSchedule();
        return;
    }
    const now = Date.now();
    clock.textContent = `현재 ${kstClockStr(now)}`;
    const { nextAt, nextName, expireAt } = scheduleState;
    if (nextAt) {
        const s = Math.max(0, Math.floor((nextAt - now) / 1000));
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        $("sc-next-label").textContent = `${kstTime(nextAt)} ${nextName}까지`;
        $("sc-remain").innerHTML = (h ? `${h}<small>시간</small> ` : "") + `${m}<small>분</small> ${String(sec).padStart(2, "0")}<small>초</small>`;
    } else {
        $("sc-next-label").textContent = scheduleState.date === kstDateStr(now) ? "오늘 남은 일정 없음" : "";
        $("sc-remain").textContent = "";
    }
    if (expireAt && expireAt <= now) renderSchedule();
}

setInterval(() => {
    if (state.currentTab === "schedule" && scheduleState.data) tickClock();
}, 1000);

let deferredInstallPrompt = null;
const pwaInstallButton = $("pwa-install-button");

if (!window.matchMedia("(display-mode: standalone)").matches) {
    pwaInstallButton.style.display = "block";
}

window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    pwaInstallButton.style.display = "block";
});

pwaInstallButton.addEventListener("click", async () => {
    if (!deferredInstallPrompt) {
        alert("Chrome 또는 Edge 메뉴에서 '앱 설치' 또는 '홈 화면에 추가'를 선택해 주세요. iPhone은 Safari 공유 메뉴에서 '홈 화면에 추가'를 선택합니다.");
        return;
    }

    pwaInstallButton.style.display = "none";
    await deferredInstallPrompt.prompt();
    deferredInstallPrompt = null;
});

window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    pwaInstallButton.style.display = "none";
});

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((error) => {
            console.error("서비스 워커 등록 실패:", error);
        });
    });
}
</script>
